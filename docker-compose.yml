services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    volumes:
      - ./output:/app/output                 # Stage 1/2/3 产物（容器外可见、重启不丢）
      - ./backend/static:/app/backend/static  # 前端可访问的产物
      - model-cache:/root/.cache              # faster-whisper / openai-whisper / huggingface 模型
      - easyocr-cache:/root/.EasyOCR          # link_pipeline 的 EasyOCR 模型
    ports:
      - "8080:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3030:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  model-cache:
  easyocr-cache: