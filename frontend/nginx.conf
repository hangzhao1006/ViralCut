server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        client_max_body_size 500M;
    }

    location /static/ {
        proxy_pass http://backend:8000/static/;
    }
}
